name: 08 - Using Variables

on:
  push:
  workflow_dispatch:

env:
  WORKFLOW_VAR: "I am a workflow env var"
  OVERWRITTEN: "I will be overwritten"
  UNDEFINED_VAR_WITH_DEFAULT: ${{ vars.UNDEFINED_VAR || 'default value' }}

jobs:
  echo:
    runs-on: ubuntu-latest

    env:
      JOB_VAR: "I am a job env var"
      OVERWRITTEN: "I have been overwritten at the job level"

    steps:
      - name: Print env variables
        env:
          STEP_VAR: "I am a step env var"
          STEP_VAR_2: "I am another step env var"
        run: |
          echo "STEP_VAR using shell syntax: $STEP_VAR"
          echo "STEP_VAR_2 using shell syntax: $STEP_VAR_2"

          echo "STEP_VAR using env context: ${{ env.STEP_VAR }}"
          echo "STEP_VAR_2 using env context: ${{ env.STEP_VAR_2 }}"

          echo "JOB_VAR using shell syntax: $JOB_VAR"
          echo "JOB_VAR using env context: ${{ env.JOB_VAR }}"

          echo "WORKFLOW_VAR using shell syntax: $WORKFLOW_VAR"
          echo "WORKFLOW_VAR using env context: ${{ env.WORKFLOW_VAR }}"

          echo "OVERWRITTEN using shell syntax: $OVERWRITTEN"
          echo "OVERWRITTEN using env context: ${{ env.OVERWRITTEN }}"

      - name: Overwrite job variable
        env:
          OVERWRITTEN: "I have been overwritten at the step level"
        run: |
          echo "OVERWRITTEN using shell syntax: $OVERWRITTEN"
          echo "OVERWRITTEN using env context: ${{ env.OVERWRITTEN }}"

      - name: Try to access step variable from another step
        run: |
          echo "Trying to access STEP_VAR from another step: $STEP_VAR"
          echo "Trying to access STEP_VAR_2 from another step: $STEP_VAR_2"

          echo "JOB_VAR is still available: $JOB_VAR"
          echo "WORKFLOW_VAR is still available: $WORKFLOW_VAR"
          echo "OVERWRITTEN is now back to job level value: $OVERWRITTEN"

  echo-two:
    runs-on: ubuntu-latest

    steps:
      - name: Print variables
        run: |
          echo "ORG_VAR: ${{ vars.ORG_VAR }}"
          echo "OVERWRITTEN_VAR: ${{ vars.OVERWRITTEN_VAR }}"
          echo "REPOSITORY_VAR: ${{ vars.HAMOODA }}"

  echo-prod:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Print prod variables
        run: |
          echo "ORG_VAR: ${{ vars.ORG_VAR }}"
          echo "OVERWRITTEN_VAR: ${{ vars.OVERWRITTEN_VAR }}"
          echo "REPOSITORY_VAR: ${{ vars.REPOSITORY_VAR }}"
          echo "TARGET_VAR: ${{ vars.TARGET_VAR }}"

  echo-undefined:
    runs-on: ubuntu-latest

    steps:
      - name: Print undefined variables
        run: |
          echo "UNDEFINED_VAR direct: ${{ vars.UNDEFINED_VAR }}"
          echo "UNDEFINED_VAR with inline default: ${{ vars.UNDEFINED_VAR || 'default value' }}"
          echo "UNDEFINED_VAR_WITH_DEFAULT from env: ${{ env.UNDEFINED_VAR_WITH_DEFAULT }}"